[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "embedded-test-runner"
dynamic = ["version"]
description = "Test orchestration for embedded devices"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "embedded-bridge @ git+https://github.com/m-mcgowan/embedded-bridge.git#subdirectory=python",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    # tests/acceptance/helpers.py imports it at module scope, so the suite
    # cannot even be COLLECTED without it — the acceptance tests skip
    # themselves without a --port, but only after their module imports.
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
